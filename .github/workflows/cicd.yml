name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: 🧹 LINT
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --locked --all-groups --all-extras

      - name: Run ruff
        run: |
          uv run ruff check .

  typecheck:
    name: 🔍 TYPECHECK
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --locked --all-groups --all-extras

      - name: Run ty
        run: |
          uv run ty check

  test:
    name: 🧪 TEST
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --locked --all-groups --all-extras

      - name: Run tests
        run: |
          uv run pytest --maxfail=1 --disable-warnings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-reports/

  extras:
    name: 🧩 EXTRAS (${{ matrix.extra }})
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { extra: authentication, package: authentication }
          - { extra: context, package: context }
          - { extra: logger, package: logger }
          - { extra: profiler, package: profiler }
          - { extra: query_language, package: query_language }
          - { extra: computation_engine, package: computation_engine }
          - { extra: serializer, package: serializer }
          - { extra: file_handler, package: file_handler }
          - { extra: runtime, package: runtime }
          - { extra: runtime-sandbox, package: runtime }
          - { extra: circuit_breaker, package: circuit_breaker }
          - { extra: retry, package: retry }
          - { extra: http, package: http }
          - { extra: resilient_http, package: resilient_http }
          - { extra: application_configuration, package: application_configuration }
          - { extra: telemetry, package: telemetry }
          - { extra: repository, package: repository }
    steps:
      - uses: actions/checkout@v4

      - name: Install the extra alone
        run: |
          pip install --upgrade pip uv
          uv venv
          uv pip install ".[${{ matrix.extra }}]"

      - name: Import every module of its package
        run: |
          .venv/bin/python -I - "${{ matrix.package }}" <<'EOF'
          import importlib, pkgutil, sys
          root = importlib.import_module(f"pycraftcore.{sys.argv[1]}")
          failures = []
          for module in pkgutil.walk_packages(root.__path__, f"{root.__name__}."):
              try:
                  importlib.import_module(module.name)
              except Exception as error:
                  failures.append(f"{module.name}: {error!r}")
          print("\n".join(failures) or f"{root.__name__}: all modules import")
          sys.exit(bool(failures))
          EOF

  build:
    name: 📦 BUILD
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: [test, extras]
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --locked --all-groups --all-extras

      - name: Build package
        run: |
          uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 🚀 PUBLISH
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: build
    if: github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Publish to TestPyPI (develop)
        if: github.ref_name == 'develop'
        env:
          UV_TEST_PYPI_URL: ${{ vars.TEST_PYPI_URL }}
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          echo "Publishing to TestPyPI..."
          uv publish --publish-url "$UV_TEST_PYPI_URL"

      - name: Publish to PyPI (main)
        if: github.ref_name == 'main'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.RELEASE_PYPI_TOKEN }}
        run: |
          echo "Publishing to PyPI..."
          uv publish