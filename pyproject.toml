[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycraftcore"
version = "0.1.0"
authors = [
    { name = "Toufik Saouchi", email = "toufik.saouchi@gmail.com" },
]
description = "Provides reusable technical infrastructure and adapter implementations for Python applications"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "numpy",
    "aiohttp",
    "orjson",
    "pyyaml",
    "omegaconf",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "pyinstrument",
    "asyncpg",
    "pydantic>=2",
    "python-dotenv",
    "msgpack>=1.1.2",
    "loguru>=0.7.3",
    "scipy>=1.17.1",
    "httpx",
    "tenacity",
    "aiobreaker",
    "aiosqlite",
    "sqlglot",
    "starlette",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis>=6.151.9",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "ruff",
    "scipy-stubs>=1.17.1.3",
    "Pyright",
    "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/s-toufik/pycraftcore"
