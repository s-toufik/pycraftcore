[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycraftcore"
version = "3.0.0"
authors = [
    { name = "Toufik Saouchi", email = "toufik.saouchi@gmail.com" },
]
description = "Provides reusable technical infrastructure and adapter implementations for Python applications"
readme = "Readme.md"
requires-python = ">=3.14"
keywords = ["infrastructure", "hexagonal-architecture", "configuration", "logging", "opentelemetry", "resilient-http", "repository", "sandbox", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "MIT"
dependencies = []

[project.optional-dependencies]
# Independent dependencies
authentication = []
context = []
logger = []
profiler = ["pyinstrument"]
query_language = ["sqlglot"]
computation_engine = ["numpy", "scipy"]
serializer = ["orjson", "msgpack", "pydantic>=2"]
file_handler = ["orjson", "pyyaml"]
runtime = ["pydantic>=2"]
web = ["pydantic>=2"]

# Dependent dependencies
circuit_breaker = ["aiobreaker", "pycraftcore[logger]"]
retry = ["tenacity", "pycraftcore[logger]"]
http = ["aiohttp", "httpx", "orjson", "pycraftcore[context, logger]"]
web_fastapi = ["fastapi", "pycraftcore[web]"]
web_litestar = ["litestar", "pycraftcore[web]"]
web_blacksheep = ["blacksheep", "pycraftcore[web]"]
resilient_http = ["aiohttp", "httpx", "pycraftcore[circuit_breaker, http, logger, retry, telemetry]"]
application_configuration = ["omegaconf", "pydantic>=2", "python-dotenv", "pycraftcore[logger, http, authentication]"]
telemetry = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp", "opentelemetry-instrumentation-logging", "pycraftcore[application_configuration, context]"]
repository = ["aiosqlite", "pymongo", "psycopg[binary]", "psycopg-pool", "orjson", "pydantic>=2", "pycraftcore[application_configuration, authentication]"]
runtime-sandbox = ["pandas", "numpy", "matplotlib", "python-dateutil", "pycraftcore[runtime]"]

all = [
    "pycraftcore[application_configuration]",
    "pycraftcore[authentication]",
    "pycraftcore[circuit_breaker]",
    "pycraftcore[computation_engine]",
    "pycraftcore[context]",
    "pycraftcore[file_handler]",
    "pycraftcore[http]",
    "pycraftcore[logger]",
    "pycraftcore[profiler]",
    "pycraftcore[query_language]",
    "pycraftcore[repository]",
    "pycraftcore[resilient_http]",
    "pycraftcore[retry]",
    "pycraftcore[runtime]",
    "pycraftcore[runtime-sandbox]",
    "pycraftcore[serializer]",
    "pycraftcore[telemetry]",
    "pycraftcore[web]",
    "pycraftcore[web_blacksheep]",
    "pycraftcore[web_fastapi]",
    "pycraftcore[web_litestar]",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-asyncio",
    "pytest-cov",
    "uvicorn",
    "asgi-lifespan",
    "ruff",
    "ty",
    "scipy-stubs",
    "pre-commit"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade
]
ignore = [
    "B017", # Blind exeception in tests
    "BLE001", # Blind exception in code
    "E501", # Line length
]

[tool.ty.src]
include = ["src", "tests/ducktype"]
exclude = [".venv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycraftcore = ["py.typed"]

[project.urls]
Homepage = "https://github.com/s-toufik/pycraftcore"
Repository = "https://github.com/s-toufik/pycraftcore"
Issues = "https://github.com/s-toufik/pycraftcore/issues"
