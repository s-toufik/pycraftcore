  log: ${oc.env:LOG_LEVEL,INFO}

  server:
    asgi:
      dummy_api_server: ${server.dummy_api_server}

  connector:
    api:
      dummy_api_1: ${connector.dummy_api_1}
      dummy_api_2: ${connector.dummy_api_2}
      dummy_api_3: ${connector.dummy_api_3}
